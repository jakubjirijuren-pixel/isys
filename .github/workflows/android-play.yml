name: FOXA Google Play AAB
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android project
        working-directory: web
        run: |
          npm install --no-audit --no-fund
          npm run build:android
          node scripts/prepare-android.mjs
          npx cap add android
      - name: Generate FOXA native launcher icons
        working-directory: web
        run: |
          python3 -m pip install --break-system-packages --quiet pillow cairosvg
          python3 scripts/generate-android-icons.py
      - name: Configure signing and Android target
        working-directory: web/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_* signing secrets"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > app/foxa-upload.jks
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          p=Path('variables.gradle')
          s,n=re.subn(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',p.read_text())
          if n!=1: raise SystemExit('targetSdkVersion not found')
          s,n=re.subn(r'minSdkVersion\\s*=\\s*\\d+','minSdkVersion = 24',s)
          if n!=1: raise SystemExit('minSdkVersion not found')
          p.write_text(s)
          p=Path('app/build.gradle')
          s=p.read_text()
          if 'android {' not in s or 'buildTypes {' not in s: raise SystemExit('Unexpected Gradle layout')
          s=s.replace('android {',"""android {
              signingConfigs {
                  playUpload {
                      storeFile file('foxa-upload.jks')
                      storePassword System.getenv('STORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }
              }
          """,1)
          s=s.replace('buildTypes {','buildTypes {\n        release { signingConfig signingConfigs.playUpload }',1)
          s,n=re.subn(r'versionCode\s+\d+','versionCode '+str(10000+int(os.environ['GITHUB_RUN_NUMBER'])),s,count=1)
          if n!=1: raise SystemExit('versionCode not found')
          p.write_text(s)
          PY
      - name: Verify Android minimum SDK configuration
        working-directory: web/android
        run: |
          grep -E 'minSdkVersion = 24' variables.gradle
          grep -E 'targetSdkVersion = 36' variables.gradle
      - name: Generate signed Play bundle
        working-directory: web/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FOXA-Google-Play-AAB
          path: web/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
