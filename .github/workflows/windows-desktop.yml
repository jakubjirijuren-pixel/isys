name: Build iSYS Desktop for Windows

on:
  workflow_dispatch:
  push:
    branches:
      - feature/windows-desktop
    paths:
      - 'desktop/**'
      - '.github/workflows/windows-desktop.yml'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install dependencies
        run: npm install
      - name: Generate temporary app icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $bmp = New-Object System.Drawing.Bitmap(512, 512)
          $graphics = [System.Drawing.Graphics]::FromImage($bmp)
          $graphics.Clear([System.Drawing.Color]::FromArgb(20, 54, 90))
          $font = New-Object System.Drawing.Font("Segoe UI", 220, [System.Drawing.FontStyle]::Bold)
          $brush = [System.Drawing.Brushes]::White
          $graphics.DrawString("i", $font, $brush, 170, 85)
          $bmp.Save("icon.png", [System.Drawing.Imaging.ImageFormat]::Png)
          $graphics.Dispose()
          $font.Dispose()
          $bmp.Dispose()
          npx tauri icon icon.png
      - name: Build Windows installer
        run: npm run desktop:build
      - name: Upload NSIS EXE installer
        uses: actions/upload-artifact@v4
        with:
          name: iSYS-Desktop-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
