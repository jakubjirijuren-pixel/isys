name: Validate iSYS vacation module
on:
  pull_request:
    branches: [web-supabase]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: web
        run: npm install
      - name: Build
        working-directory: web
        run: npm run build
