name: Build FOXA Android APK
on:
  push:
    branches: [web-supabase]
    paths:
      - 'web/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install web dependencies
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build Android web bundle
        working-directory: web
        run: |
          npm run build:android
          node scripts/prepare-android.mjs
      - name: Generate Android project
        working-directory: web
        run: npx cap add android
      - name: Build installable test APK
        working-directory: web/android
        run: bash ./gradlew assembleDebug --no-daemon
      - name: Publish APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOXA-Android-test-APK
          path: web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
